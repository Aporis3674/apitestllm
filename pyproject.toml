[project]
name = "apitestllm"
version = "0.1.0"
description = "Next-Gen AI API Benchmark, Multi-Model Arena, TTFT Telemetry & CI/CD Diagnostic Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
apitestllm = "apitestllm.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "basedpyright>=1.39.0",
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.basedpyright]
exclude = [".venv"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
